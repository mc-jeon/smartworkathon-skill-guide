<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
  background:linear-gradient(135deg,#efeaff 0%,#fde9f2 55%,#fff1e6 100%);color:#1d1f33;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.9),transparent 44%)}
.l{position:absolute;left:70px;top:68px;width:660px}
.eb{display:inline-block;padding:8px 20px;border:1.5px solid #fff;background:#fff;color:#5a4bd6;box-shadow:0 8px 18px -8px rgba(110,90,200,.45);border-radius:999px;font-size:21px;font-weight:700}
h1{font-size:60px;font-weight:900;line-height:1.18;letter-spacing:-.03em;margin:28px 0 22px;word-break:keep-all}
h1 em{font-style:normal;background:linear-gradient(90deg,#7c5cff,#ff6fa5 55%,#ff9a62);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:46px}
p{font-size:26px;color:#4a4f66;line-height:1.5;word-break:keep-all}
.tags{position:absolute;left:70px;bottom:60px;display:flex;gap:12px}
.tags span{font-size:21px;font-weight:700;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #fff;color:#3b3e5c;box-shadow:0 6px 14px -6px rgba(100,90,170,.4)}
.card{position:absolute;right:60px;top:110px;width:390px;background:#fff;color:#202124;border-radius:28px;box-shadow:0 30px 50px -24px rgba(105,85,175,.6),inset 0 -6px 12px rgba(124,102,255,.12);overflow:hidden;padding:18px}
.card h3{font-size:19px;color:#0b1f4b;margin-bottom:12px}
.card .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:17px}
.card .n{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffd0e2 0,#ff4f93 45%,#e0246d 100%);box-shadow:0 5px 10px -4px rgba(224,36,109,.7);color:#fff;font:900 16px/30px Arial;text-align:center;flex-shrink:0}
</style></head>
<body>
<div class="l">
  <div class="eb">제5회 스마트워크톤 · 트랙B</div>
  <h1>스킬 제작 가이드<br><em>복사·붙여넣기로<br>완성하는 AI 스킬</em></h1>
  <p>상품 정보 하나로 마케팅 콘텐츠를<br>한 번에 만드는 나만의 AI 스킬(txt)</p>
</div>
<div class="tags"><span>📋 복사·붙여넣기</span><span>🤖 아무 AI나</span><span>📄 txt 제출</span></div>
<div class="card">
  <h3>이 순서로 따라 하세요</h3>
  <div class="row"><span class="n">1</span>스킬 만드는 프롬프트 붙여넣기</div>
  <div class="row"><span class="n">2</span>메모장에 txt로 저장</div>
  <div class="row"><span class="n">3</span>새 채팅에서 샘플 상품으로 실행</div>
  <div class="row"><span class="n">4</span>지어낸 내용 점검·다른 상품 시험</div>
  <div class="row" style="border:0"><span class="n">5</span>스킬 + 출력물 제출</div>
</div>
<div style="position:absolute;left:560px;top:52px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#d6ccff 28%,#8f7bff 72%,#6a55e8 100%);box-shadow:0 14px 22px -10px rgba(106,85,232,.6)"></div><div style="position:absolute;left:690px;bottom:70px;width:44px;height:44px;border-radius:14px;transform:rotate(14deg);background:linear-gradient(145deg,#b6f1e2,#5fd3b8);box-shadow:0 12px 18px -8px rgba(60,170,140,.6),inset 0 3px 3px rgba(255,255,255,.6)"></div></body></html>
